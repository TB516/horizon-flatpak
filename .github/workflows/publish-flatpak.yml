name: Publish Flatpak repository

on:
  push:
    branches:
      - main
    # Only republish when the app or its publishing changes.
    paths:
      - flatpak/**
      - .github/workflows/publish-flatpak.yml
  workflow_dispatch:
    inputs:
      first-publish:
        description: Start a new repository without published history (first publication only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  APP_ID: dev.playhorizon.Launcher
  FLATPAK_BRANCH: stable
  FLATPAK_REPOSITORY_URL: https://horizon.thomasberrios.com/repo
  PAGES_DIR: build-flatpak/pages
  REPO_DIR: build-flatpak/pages/repo

jobs:
  publish:
    name: Build and publish x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        shell: bash
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      # A volume seeded from the image keeps runtime updates off the read-only overlay
      # layer, where they fail with "Invalid cross-device link" (flatpak-github-actions#267).
      options: --privileged -v /var/lib/flatpak
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Import repository signing key
        id: signing
        uses: crazy-max/ghaction-import-gpg@v7
        with:
          gpg_private_key: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}

      - name: Prepare Flatpak repository
        env:
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          mkdir -p "$REPO_DIR"
          gpg --batch --export "$GPG_FINGERPRINT" > build-flatpak-repository-key.gpg
          ostree --repo="$REPO_DIR" init --mode=archive-z2

      - name: Restore published history
        if: ${{ !inputs.first-publish }}
        run: |
          ostree --repo="$REPO_DIR" remote add \
            --gpg-import=build-flatpak-repository-key.gpg \
            published "$FLATPAK_REPOSITORY_URL"
          ostree --repo="$REPO_DIR" pull \
            --disable-static-deltas --mirror --depth=2 \
            published "app/$APP_ID/x86_64/$FLATPAK_BRANCH"
          ostree --repo="$REPO_DIR" remote delete published

      - name: Build signed Flatpak
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak/${{ env.APP_ID }}.yml
          arch: x86_64
          branch: ${{ env.FLATPAK_BRANCH }}
          build-bundle: false
          upload-artifact: false
          build-dir: build-flatpak/publish-build
          repo-dir: ${{ env.REPO_DIR }}
          state-dir: build-flatpak/builder-state
          gpg-sign: ${{ steps.signing.outputs.fingerprint }}
          cache-key: flatpak-builder-x86_64-${{ hashFiles('flatpak/**', '!flatpak/pages/**') }}

      - name: Sign repository summary
        env:
          GPG_FINGERPRINT: ${{ steps.signing.outputs.fingerprint }}
        run: |
          flatpak build-update-repo \
            --gpg-sign="$GPG_FINGERPRINT" \
            --prune --prune-depth=2 "$REPO_DIR"

      - name: Stage website and install links
        run: |
          cp -a flatpak/pages/. "$PAGES_DIR/"
          cp "build-flatpak/publish-build/files/share/app-info/icons/flatpak/128x128@2/$APP_ID.png" "$PAGES_DIR/icon.png"
          encoded_key=$(base64 --wrap=0 < build-flatpak-repository-key.gpg)
          sed -i "s|@GPG_KEY@|$encoded_key|g" "$PAGES_DIR/"*.flatpakrepo "$PAGES_DIR/"*.flatpakref

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
